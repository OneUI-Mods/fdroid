Name: Galaxy Capture Tools
Summary: Extend Galaxy recording and screenshots
Description: <p>Adds optional recording rotation, app targeting, audio and capture
  controls to supported Samsung and Android recording components. Call playback can
  be included explicitly while preserving the selected app audio scope. Requires root
  and a libxposed API 102 compatible framework. Call capture availability depends
  on the audio route and app. Read the source README for supported firmware and activation
  steps.</p>
