Name: Tail ADB
Summary: ADB access over your Tailscale network
Description: <p>Provides an authorized ADB transport restricted to the device's Tailscale
  interface, with per-peer shell and root permissions and network recovery. Requires
  root and the separate Tailscale app. It uses the selected Tailscale account's network;
  no Tailscale code is bundled.</p>
